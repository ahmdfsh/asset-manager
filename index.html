<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset IT — Manajemen Aset IT FIK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">AssetIT</span>
    </div>
    <ul class="nav-links">
      <li><button class="nav-btn active" data-page="dashboard"><span class="nav-icon">◈</span> Dashboard</button></li>
      <li><button class="nav-btn" data-page="users"><span class="nav-icon">◉</span> Data per User</button></li>
      <li><button class="nav-btn" data-page="assets"><span class="nav-icon">▣</span> Master Aset</button></li>
      <li><button class="nav-btn" data-page="specs"><span class="nav-icon">⊞</span> Spesifikasi PC</button></li>
      <li><button class="nav-btn" data-page="log-asset"><span class="nav-icon">⇄</span> Log Pertukaran</button></li>
      <li><button class="nav-btn" data-page="log-component"><span class="nav-icon">⚙</span> Log Komponen</button></li>
      <li><button class="nav-btn" data-page="log-service"><span class="nav-icon">🔧</span> Log Servis</button></li>
    </ul>
    <div class="sidebar-footer">
      <button class="btn-export" onclick="exportData()">↓ Export JSON</button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <p class="page-sub" id="pageSub">Ringkasan sistem manajemen aset IT</p>
      </div>
      <div class="topbar-right">
        <span class="live-badge">● LIVE</span>
        <span class="date-badge" id="currentDate"></span>
      </div>
    </header>

    <div class="page-content" id="pageContent"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Form</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn-primary" id="modalSave" onclick="saveModal()">Simpan</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
